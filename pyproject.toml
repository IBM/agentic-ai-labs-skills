#
# Maintainer tooling only (validator, catalog generator, drift check, tests).
# Skill content has no code. The installer (scripts/install_skills.py) is
# stdlib-only and needs none of these dependencies.
[project]
name = "agentic-ai-labs-skills-tooling"
version = "0.0.0"
description = "Maintainer tooling for the Agentic AI Labs skills catalog"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
