# IBM Detect Secrets — pipeline gate (ITSS Ch.5 §2.3.a.iii).
# Runs the official git-defenders container image on every PR and push to main,
# failing the build if any unaudited, live, or audited-as-real secret is found.
# This is the CI counterpart to the local pre-commit hook (.pre-commit-config.yaml).
name: Detect Secrets

on:
  pull_request:
  push:
    branches: [main]

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Re-scan the working tree into the committed baseline. A newly introduced
      # secret lands as "unaudited", which the report step below fails on.
      - name: Update secrets baseline
        run: |
          docker run --pull=always -a stdout --rm -v "$(pwd):/code" \
            icr.io/git-defenders/detect-secrets:redhat-ubi \
            scan --update .secrets.baseline

      # Fail the build on any unaudited, live, or audited-as-real secret.
      - name: Audit report
        run: |
          docker run -a stdout --rm -v "$(pwd):/code" \
            icr.io/git-defenders/detect-secrets:redhat-ubi \
            audit --report --fail-on-unaudited --fail-on-live --fail-on-audited-real \
            .secrets.baseline
