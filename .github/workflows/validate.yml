#
# Validates the skills catalog: product manifests, skill front matter, catalog
# entries (provenance, license, content hash, security flags, guardrail),
# headers, and (on pull requests) the version-bump rule. Run locally with:
#   uv run scripts/validate.py
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.12"
      - name: Install dev tooling (locked)
        run: uv sync --frozen
      - name: Validate catalog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --frozen scripts/validate.py
