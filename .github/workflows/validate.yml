#
# Validates the skills catalog: product manifests, skill front matter, catalog
# entries (provenance, license, content hash, security flags, guardrail),
# headers, and (on pull requests) the version-bump rule; checks that the
# generated catalog files are current; and runs the tooling tests. Locally:
#   uv run scripts/validate.py && uv run scripts/build_catalog.py --check && uv run pytest
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
      - name: Install dev tooling (locked)
        run: uv sync --frozen
      - name: Validate catalog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --frozen scripts/validate.py
      - name: Generated catalog files are current
        run: uv run --frozen scripts/build_catalog.py --check
      - name: Tooling tests
        run: uv run --frozen pytest -q
