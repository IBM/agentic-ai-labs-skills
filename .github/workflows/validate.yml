#
# Lints the marketplace manifest, plugin manifests, skill/command front matter,
# file headers, and (on pull requests) the version-bump rule. The checks live in
# .github/scripts/validate.py so they can be run locally:
#   python3 .github/scripts/validate.py
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate marketplace, plugins, and skills
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/validate.py
